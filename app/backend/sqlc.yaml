version: "2"
sql:
  - engine: sqlite
    schema: migrations
    queries: internal/store/queries.sql
    gen:
      go:
        package: store
        out: internal/store
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_querier_file_name: querier.gen.go
        output_files_suffix: .gen
        emit_interface: true
        emit_empty_slices: true
