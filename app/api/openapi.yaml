openapi: 3.0.3
info:
  title: KI Perspektiven API
  version: 0.1.0
  description: |
    Verbindlicher Vertrag zwischen Frontend und Backend (siehe requirements/ARCHITECTURE.md, Abschnitt 5).
    Öffentliche Endpunkte liefern ausschließlich veröffentlichte Beiträge und fachlich freigegebene
    Audit-Dimensionen.

    Redaktion (ab Sprint 3): Die Anmeldung setzt ein HttpOnly-Sitzungscookie (`ki_session`). Alle Pfade
    unter `/api/admin` verlangen eine gültige Sitzung (sonst `401`) und die passende Rolle (sonst `403`).
    Schreibende Aufrufe mit Sitzung senden zusätzlich das CSRF-Token aus `GET /api/auth/me` im Header
    `X-CSRF-Token` (sonst `403`). Einen Endpunkt zur Selbstregistrierung gibt es nicht.

    Sprachauswahl: Jede Ressource wird in der angefragten Sprache geliefert. Fehlt die Übersetzung,
    liefert das Backend die vorhandene Fassung (zuerst Deutsch). Das Feld `lang` nennt immer die
    tatsächlich gelieferte Sprache.
servers:
  - url: /
paths:
  /api/topics:
    get:
      operationId: listTopics
      summary: Alle Themen mit Titel und Einführung
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Themen in fester Reihenfolge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/topics/{slug}:
    get:
      operationId: getTopic
      summary: Ein Thema mit seinen veröffentlichten Beiträgen
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Thema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/posts:
    get:
      operationId: listPosts
      summary: Veröffentlichte Beiträge, neueste zuerst
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: featured
          in: query
          required: false
          description: |
            `true` liefert die Beiträge für das Karussell der Startseite (höchstens drei).
            An erster Stelle steht immer der zuletzt veröffentlichte Beitrag, danach folgen
            die neuesten weiteren hervorgehobenen Beiträge.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Beiträge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/posts/{slug}:
    get:
      operationId: getPost
      summary: Ein veröffentlichter Beitrag
      description: Für Entwürfe und unbekannte Beiträge antwortet das Backend mit `404`.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Beitrag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/audit:
    get:
      operationId: getAudit
      summary: Einstieg in das KI-Audit mit allen freigegebenen Dimensionen
      description: Erscheint auf der Themenseite `ai-audit` (Anforderung 8).
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Einführung, Reifegrade und Dimensionen in fester Reihenfolge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/audit/dimensions/{slug}:
    get:
      operationId: getAuditDimension
      summary: Eine Audit-Dimension mit Vorteilen, Reifegraden und Prüffragen
      description: |
        Inhalte der Dimensionsseite und des Quiz (Anforderungen 9 und 10). Für unbekannte und
        fachlich nicht freigegebene Dimensionen antwortet das Backend mit `404`. Das Quiz wertet
        die Antworten im Browser aus; sie werden nicht an das Backend gesendet.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Dimension
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditDimension'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/health:
    get:
      operationId: getHealth
      summary: Zustand der Anwendung und der Datenbank
      responses:
        '200':
          description: Anwendung und Datenbank sind erreichbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Datenbank ist nicht erreichbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/auth/login:
    post:
      operationId: login
      summary: Anmelden, setzt das Sitzungscookie
      description: |
        Unbekannte E-Mail-Adressen, falsche Passwörter und deaktivierte Konten liefern dieselbe Antwort `401`.
        Nach zu vielen Fehlversuchen von derselben IP-Adresse antwortet das Backend mit `429`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Angemeldet
          headers:
            Set-Cookie:
              description: Sitzungscookie `ki_session` (HttpOnly, SameSite=Lax, bei HTTPS Secure)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Zu viele Fehlversuche, später erneut versuchen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Abmelden, löscht die Sitzung serverseitig
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Abgemeldet
          headers:
            Set-Cookie:
              description: Leert das Sitzungscookie
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/me:
    get:
      operationId: getMe
      summary: Angemeldete Person, Rolle und CSRF-Token
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Angemeldet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/posts:
    get:
      operationId: adminListPosts
      summary: Alle Beiträge inklusive Entwürfe, zuletzt geänderte zuerst
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Beiträge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPostList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: adminCreatePost
      summary: Neuen Entwurf anlegen
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: Entwurf angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/admin/posts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: adminGetPost
      summary: Beitrag mit allen Sprachfassungen zum Bearbeiten laden
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Beitrag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: adminUpdatePost
      summary: Texte, Themen und Einstellungen speichern
      description: |
        Ein veröffentlichter Beitrag bleibt veröffentlicht, die öffentliche Seite zeigt sofort die neue Fassung.
        Er muss dafür in jeder Sprache Titel, Kurztext und Beitragstext behalten (sonst `422`).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/admin/posts/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: adminPublishPost
      summary: Veröffentlichen
      description: Verlangt Titel, Kurztext und Beitragstext in jeder vorhandenen Sprache (sonst `422`).
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Veröffentlicht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/admin/posts/{id}/schedule:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: adminSchedulePost
      summary: Automatische Veröffentlichung planen oder ändern
      description: |
        Nur für Beiträge „In Arbeit“ (Ticket #23). Der Zeitpunkt muss in der Zukunft liegen, und der Beitrag
        braucht Titel, Kurztext und Beitragstext in jeder vorhandenen Sprache (sonst `422`). Das Backend
        veröffentlicht fällige Beiträge mit höchstens einer Minute Verzögerung.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        200:
          description: Geplant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: adminUnschedulePost
      summary: Geplanten Zeitpunkt entfernen
      description: Der Beitrag bleibt „In Arbeit“.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        200:
          description: Zeitpunkt entfernt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
  /api/admin/posts/{id}/unpublish:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: adminUnpublishPost
      summary: Veröffentlichung zurücknehmen
      description: Der Beitrag wird wieder zum Entwurf und ist öffentlich nicht mehr erreichbar.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Zurückgenommen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/users:
    get:
      operationId: adminListUsers
      summary: Redaktionskonten mit E-Mail-Adresse, Rolle und Status
      description: Nur für Admin-Konten. Passwörter und Hashes gibt die API nie zurück.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Konten, sortiert nach E-Mail-Adresse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: adminCreateUser
      summary: Redaktionskonto mit Rolle editor und Startpasswort anlegen
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: Konto angelegt, es kann sich sofort anmelden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: adminUpdateUser
      summary: Konto deaktivieren oder reaktivieren
      description: |
        Beim Deaktivieren löscht das Backend alle Sitzungen des Kontos in derselben Transaktion.
        Bereits geöffnete Sitzungen sind damit sofort ungültig. Das eigene Konto lässt sich nicht deaktivieren (`422`).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ki_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Lang:
      name: lang
      in: query
      required: false
      description: Gewünschte Sprache
      schema:
        $ref: '#/components/schemas/Lang'
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Ungültige Anfrage
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Nicht angemeldet oder Sitzung abgelaufen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Rolle reicht nicht aus oder CSRF-Token fehlt
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Konflikt, z. B. bereits vergebenes URL-Kürzel oder E-Mail-Adresse
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Eingaben unvollständig oder ungültig, die Meldung nennt den Grund
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Nicht gefunden oder nicht öffentlich
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Lang:
      type: string
      enum: [de, en]
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unavailable]
    TopicRef:
      type: object
      description: Kurzform eines Themas, z. B. für Themen-Chips
      required: [slug, lang, title, label]
      properties:
        slug:
          type: string
        lang:
          $ref: '#/components/schemas/Lang'
        title:
          type: string
        label:
          type: string
          description: Kurze Bezeichnung für Chips
    Topic:
      type: object
      required: [slug, lang, title, label, summary, intro, postCount]
      properties:
        slug:
          type: string
        lang:
          $ref: '#/components/schemas/Lang'
        title:
          type: string
        label:
          type: string
        summary:
          type: string
          description: Eine Zeile Beschreibung für Menü und Karten
        intro:
          type: string
          description: Einführung auf der Themenseite
        postCount:
          type: integer
          description: Anzahl der veröffentlichten Beiträge
    TopicList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
    TopicDetail:
      allOf:
        - $ref: '#/components/schemas/Topic'
        - type: object
          required: [posts, translations]
          properties:
            translations:
              type: array
              description: Sprachen, in denen das Thema vorliegt
              items:
                $ref: '#/components/schemas/Lang'
            posts:
              type: array
              items:
                $ref: '#/components/schemas/PostSummary'
    Image:
      type: object
      required: [src, srcset, width, height, alt]
      properties:
        src:
          type: string
          description: URL der mittleren Variante (960 px)
        srcset:
          type: string
          description: Varianten 480, 960 und 1600 px für `srcset`
        width:
          type: integer
        height:
          type: integer
        alt:
          type: string
        altLang:
          $ref: '#/components/schemas/Lang'
    PostSummary:
      type: object
      required: [slug, lang, title, summary, publishedAt, featured, topics, translations]
      properties:
        slug:
          type: string
        lang:
          $ref: '#/components/schemas/Lang'
        title:
          type: string
        summary:
          type: string
          description: Kurztext
        publishedAt:
          type: string
          format: date-time
        featured:
          type: boolean
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TopicRef'
        translations:
          type: array
          description: Sprachen, in denen der Beitrag vorliegt
          items:
            $ref: '#/components/schemas/Lang'
        cover:
          $ref: '#/components/schemas/Image'
    PostList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostSummary'
    Post:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          required: [bodyMarkdown, readingMinutes, updatedAt]
          properties:
            bodyMarkdown:
              type: string
            readingMinutes:
              type: integer
            updatedAt:
              type: string
              format: date-time
    Role:
      type: string
      description: "`editor` verwaltet Beiträge, `admin` zusätzlich die Redaktionskonten"
      enum: [editor, admin]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    Me:
      type: object
      required: [id, email, role, csrfToken]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        csrfToken:
          type: string
          description: Für den Header `X-CSRF-Token` bei schreibenden Aufrufen
    PostStatus:
      type: string
      description: "`draft` erscheint in der Redaktion als „In Arbeit“, `published` als „Veröffentlicht“"
      enum: [draft, published]
    PostText:
      type: object
      description: Fassung eines Beitrags in einer Sprache
      required: [lang, title, summary, bodyMarkdown]
      properties:
        lang:
          $ref: '#/components/schemas/Lang'
        title:
          type: string
        summary:
          type: string
          description: Kurztext
        bodyMarkdown:
          type: string
    PostInput:
      type: object
      required: [featured, topics, texts]
      properties:
        slug:
          type: string
          description: URL-Kürzel. Leer lassen, um es aus dem Titel zu erzeugen.
        featured:
          type: boolean
          description: Im Karussell der Startseite hervorheben
        topics:
          type: array
          description: Slugs der zugeordneten Themen
          items:
            type: string
        texts:
          type: array
          description: Fassungen je Sprache. Leere Fassungen werden nicht gespeichert.
          items:
            $ref: '#/components/schemas/PostText'
    EditorPost:
      type: object
      required: [id, slug, status, featured, topics, texts, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        status:
          $ref: '#/components/schemas/PostStatus'
        featured:
          type: boolean
        topics:
          type: array
          items:
            type: string
        texts:
          type: array
          items:
            $ref: '#/components/schemas/PostText'
        publishedAt:
          type: string
          format: date-time
          description: Erste Veröffentlichung
        scheduledAt:
          type: string
          format: date-time
          description: Geplante automatische Veröffentlichung in UTC, nur bei Beiträgen „In Arbeit“
        updatedAt:
          type: string
          format: date-time
    EditorPostSummary:
      type: object
      required: [id, slug, status, title, featured, topics, translations, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        status:
          $ref: '#/components/schemas/PostStatus'
        title:
          type: string
          description: Deutscher Titel, sonst der Titel einer anderen Sprache
        featured:
          type: boolean
        topics:
          type: array
          items:
            type: string
        translations:
          type: array
          items:
            $ref: '#/components/schemas/Lang'
        publishedAt:
          type: string
          format: date-time
        scheduledAt:
          type: string
          format: date-time
          description: Geplante automatische Veröffentlichung in UTC
        updatedAt:
          type: string
          format: date-time
    ScheduleInput:
      type: object
      required: [publishAt]
      properties:
        publishAt:
          type: string
          format: date-time
          description: Zeitpunkt der automatischen Veröffentlichung, mit Zeitzone (wird in UTC gespeichert)
    User:
      type: object
      description: Redaktionskonto ohne Passwortdaten
      required: [id, email, role, active, createdAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean
          description: Deaktivierte Konten können sich nicht anmelden
        createdAt:
          type: string
          format: date-time
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
    NewUser:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: Eindeutige E-Mail-Adresse, Groß- und Kleinschreibung zählt nicht
        password:
          type: string
          description: Startpasswort mit mindestens 10 Zeichen
    UserPatch:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
    EditorPostList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EditorPostSummary'
    AuditCategory:
      type: string
      description: Einordnung der Dimension (organisatorisch, fachlich, technisch)
      enum: [organizational, business, technical]
    AuditLevelInfo:
      type: object
      description: Allgemeine Beschreibung eines Reifegrads
      required: [level, name, motto]
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 3
        name:
          type: string
          description: Einfach, Strukturiert oder Intelligent
        motto:
          type: string
          description: Leitsatz des Reifegrads
    AuditDimensionSummary:
      type: object
      required: [slug, lang, title, summary, category]
      properties:
        slug:
          type: string
        lang:
          $ref: '#/components/schemas/Lang'
        title:
          type: string
        summary:
          type: string
          description: Eine Zeile Beschreibung für die Übersicht
        category:
          $ref: '#/components/schemas/AuditCategory'
    AuditOverview:
      type: object
      required: [lang, translations, intro, levels, dimensions]
      properties:
        lang:
          $ref: '#/components/schemas/Lang'
        translations:
          type: array
          items:
            $ref: '#/components/schemas/Lang'
        intro:
          type: array
          description: Absätze der Einführung
          items:
            type: string
        levels:
          type: array
          description: Die Reifegrade 1 bis 3
          items:
            $ref: '#/components/schemas/AuditLevelInfo'
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/AuditDimensionSummary'
    AuditQuestion:
      type: object
      required: [id, text, conditional]
      properties:
        id:
          type: string
          description: Reifegrad und laufende Nummer, z. B. `2.3`
        text:
          type: string
        conditional:
          type: boolean
          description: |
            Gilt nur unter einer Voraussetzung (z. B. „Bei Agenten: …“). Darf mit „Trifft nicht zu“
            beantwortet werden und zählt dann als erfüllt.
    AuditLevel:
      type: object
      required: [level, name, description, questions]
      properties:
        level:
          type: integer
          minimum: 0
          maximum: 3
        name:
          type: string
        description:
          type: string
          description: Bedeutung des Reifegrads in dieser Dimension
        questions:
          type: array
          description: Prüffragen (Ja/Nein). Reifegrad 0 hat keine.
          items:
            $ref: '#/components/schemas/AuditQuestion'
    AuditDimension:
      type: object
      required: [slug, lang, title, summary, category, translations, intro, benefits, notApplied, levels]
      properties:
        slug:
          type: string
        lang:
          $ref: '#/components/schemas/Lang'
        title:
          type: string
        summary:
          type: string
        category:
          $ref: '#/components/schemas/AuditCategory'
        translations:
          type: array
          items:
            $ref: '#/components/schemas/Lang'
        intro:
          type: array
          description: Absätze der Einführung
          items:
            type: string
        benefits:
          type: array
          description: Mindestens zwei konkrete Vorteile
          items:
            type: string
        notApplied:
          $ref: '#/components/schemas/AuditLevel'
        levels:
          type: array
          description: |
            Reifegrade 1 bis 3. Ein Reifegrad ist erreicht, wenn alle seine Prüffragen und die aller
            darunterliegenden Reifegrade erfüllt sind. Ist Reifegrad 1 nicht erfüllt, gilt Reifegrad 0.
          items:
            $ref: '#/components/schemas/AuditLevel'
