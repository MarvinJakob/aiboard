# Produktion auf dem Hetzner-Cloud-Server (ARCHITECTURE.md, Abschnitt 9).
# Deployment und Rollback mit deploy/deploy.sh, siehe docs/betrieb.md.
# Entwicklungs-Testdaten (DEV_SEED) sind hier bewusst nicht gesetzt.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - app_media:/srv/media:ro
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  backend:
    image: ${REGISTRY}/ki-web:${VERSION}
    environment:
      DATABASE_PATH: /data/db/app.db
      MEDIA_PATH: /data/media
      PUBLIC_BASE_URL: https://${DOMAIN}
      # Caddy setzt X-Forwarded-For; daraus liest das Backend die IP für die Begrenzung der Anmeldeversuche.
      TRUST_PROXY: "true"
      # Zugangsschutz vor dem Livegang (Ticket #49): Die Webseite sieht nur, wer angemeldet ist.
      # Zum Livegang REQUIRE_LOGIN=false in die .env schreiben.
      REQUIRE_LOGIN: ${REQUIRE_LOGIN:-true}
    volumes:
      - app_db:/data/db
      - app_media:/data/media
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Nach dem Start alle 2 s prüfen, damit Deployments nicht 30 s auf den ersten Healthcheck warten
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  app_db:
  app_media:
